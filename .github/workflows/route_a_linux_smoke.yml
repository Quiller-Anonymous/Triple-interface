name: Route A Linux Smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Lean module to build"
        required: true
        default: "Goldbach.Cert.MajorArcModules.Q0MinorZeroModeNormalizedAverageX0Cert"
      olean_only:
        description: "Build only the .olean target"
        required: true
        default: "true"
      build_timeout_minutes:
        description: "Stop the build before GitHub's 6h job limit so cache/artifacts can save"
        required: true
        default: "200"
      build_mode:
        description: "Build mode: direct avoids Lake C/IR artifacts; lake uses Lake's native module builder"
        required: true
        default: "direct"
      direct_workers:
        description: "Parallel workers for direct mode"
        required: true
        default: "4"
      module_timeout_minutes:
        description: "Stop and checkpoint if one direct-mode module runs too long"
        required: true
        default: "150"
      auto_continue:
        description: "Automatically dispatch another run after a resumable timeout"
        required: true
        default: "true"

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Build selected Route A target on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 270

    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/.ghcup || true
          docker system prune -af || true
          sudo apt-get clean || true
          echo "Disk after cleanup:"
          df -h

      - name: Restore Route A smoke generated sources
        id: restore_sources
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(.github/route_a_smoke/*.tar.gz)
          if [ "${#archives[@]}" -gt 0 ]; then
            for archive in "${archives[@]}"; do
              if [ -f "${archive}.sha256" ]; then
                (
                  cd "$(dirname "${archive}")"
                  shasum -a 256 -c "$(basename "${archive}.sha256")"
                )
              else
                echo "::warning::No checksum file found for ${archive}."
              fi
              tar -xzf "${archive}"
              manifest="${archive%.tar.gz}.txt"
              if [ -f "${manifest}" ]; then
                restored_count="$(wc -l < "${manifest}" | tr -d ' ')"
              else
                restored_count="unknown"
              fi
              echo "Restored ${restored_count} Route A generated sources from ${archive}."
            done
          else
            echo "No Route A smoke source archives found."
          fi

      - name: Workflow input summary
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          echo "Workflow SHA: ${GITHUB_SHA}"
          echo "target=${{ github.event.inputs.target }}"
          echo "olean_only=${{ github.event.inputs.olean_only }}"
          echo "build_timeout_minutes=${{ github.event.inputs.build_timeout_minutes }}"
          echo "build_mode=${{ github.event.inputs.build_mode }}"
          echo "direct_workers=${{ github.event.inputs.direct_workers }}"
          echo "module_timeout_minutes=${{ github.event.inputs.module_timeout_minutes }}"
          echo "auto_continue=${{ github.event.inputs.auto_continue }}"

      - name: Audit Route A generated source archive
        id: archive_audit
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          python3 scripts/ci/route_a_source_archive_audit.py \
            --target '${{ github.event.inputs.target }}' \
            --manifest .github/route_a_smoke/*_missing_sources.txt \
            --archive .github/route_a_smoke/*.tar.gz \
            --json-output route-a-source-archive-audit.json

      - name: Cache elan toolchain
        id: cache_elan
        timeout-minutes: 10
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Set up Lean
        id: setup_lean
        timeout-minutes: 20
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: Environment diagnostics
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          echo "Cores: $(nproc)"
          free -h || true
          echo "Stack before:"
          ulimit -s || true
          ulimit -s unlimited || true
          echo "Stack after:"
          ulimit -s || true
          elan --version
          lake --version
          lean --version
          timeout --version || true
          git rev-parse HEAD
          echo "Workflow SHA: ${GITHUB_SHA}"
          echo "Requested build timeout: ${{ github.event.inputs.build_timeout_minutes }} minutes"
          df -h

      - name: Fetch dependencies
        id: fetch_deps
        timeout-minutes: 20
        run: lake update

      - name: Fetch Mathlib cache
        id: fetch_mathlib
        timeout-minutes: 45
        run: lake exe cache get

      - name: Prepare smoke log files
        id: prepare_logs
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          : > route-a-linux-smoke.log
          {
            echo "target=${{ github.event.inputs.target }}"
            echo "exit_code=not_started"
            echo "build_timeout_minutes=${{ github.event.inputs.build_timeout_minutes }}"
            echo "auto_continue=${{ github.event.inputs.auto_continue }}"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "prepared_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > route-a-build-status.txt

      - name: Restore project Lake artifact cache
        id: route_a_cache_restore
        continue-on-error: true
        timeout-minutes: 20
        uses: actions/cache/restore@v4
        with:
          path: .lake/build/lib/lean
          key: route-a-linux-smoke-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.inputs.build_mode }}-${{ github.event.inputs.target }}-latest
          restore-keys: |
            route-a-linux-smoke-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.inputs.build_mode }}-${{ github.event.inputs.target }}-
            route-a-linux-smoke-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-

      - name: Verify isolated Route A target
        id: verify_target
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          target='${{ github.event.inputs.target }}'
          case "$target" in
            Goldbach.Cert.MajorArcModules.Q0MinorZeroModeNormalizedAverageX0PeriodicMainZero*) ;;
            Goldbach.Cert.MajorArcModules.Q0MinorZeroModeNormalizedAverageX0PeriodicMainFinal) ;;
            Goldbach.Cert.MajorArcModules.Q0MinorZeroModeNormalizedAverageX0Cert) ;;
            Goldbach.Cert.MajorArcModules.Q0RouteAPostCertBridgeProbe) ;;
            *)
              echo "::error::Route A Linux smoke is restricted to Route A periodic-main/top-level/bridge targets, got '${target}'."
              exit 2
              ;;
          esac
          target_path="${target//./\/}.lean"
          if [ ! -f "$target_path" ]; then
            echo "::error::Target source file does not exist: ${target_path}"
            exit 2
          fi
          echo "Target: ${target}"
          echo "Source: ${target_path}"
          echo "Build mode: ${{ github.event.inputs.build_mode }}"
          echo "Lake command, if requested: lake --log-level=error build +${target}:olean"
          echo "Direct command, if requested: lake env python3 -u scripts/ci/route_a_direct_olean_build.py --target ${target} --workers ${{ github.event.inputs.direct_workers }} --trust-unstamped-cache"
          echo "Restored Route A artifacts:"
          find .lake/build -type f \
            \( -name '*Acc719*' -o -name '*Acc720*' -o -name '*Slice720*' \
               -o -name '*Slice721*' -o -name '*Acc721*' \) \
            -print 2>/dev/null | sort | tee route-a-restored-artifacts.txt || true
          echo "Source dependency probe:"
          if lake env lean --src-deps "$target_path" > route-a-src-deps.txt 2>&1; then
            sed -n '1,160p' route-a-src-deps.txt
          else
            echo "::warning::lean --src-deps failed; preserving output for diagnosis."
            sed -n '1,160p' route-a-src-deps.txt || true
          fi

      - name: Build selected target
        id: build
        shell: bash
        timeout-minutes: 260
        run: |
          set -euo pipefail
          target='${{ github.event.inputs.target }}'
          case "$target" in
            Goldbach.Cert.MajorArcModules.Q0MinorZeroModeNormalizedAverageX0PeriodicMainZero*) ;;
            Goldbach.Cert.MajorArcModules.Q0MinorZeroModeNormalizedAverageX0PeriodicMainFinal) ;;
            Goldbach.Cert.MajorArcModules.Q0MinorZeroModeNormalizedAverageX0Cert) ;;
            Goldbach.Cert.MajorArcModules.Q0RouteAPostCertBridgeProbe) ;;
            *)
              echo "::error::Route A Linux smoke is restricted to Route A periodic-main/top-level/bridge targets, got '${target}'."
              exit 2
              ;;
          esac
          target_path="${target//./\/}.lean"
          if [ ! -f "$target_path" ]; then
            echo "::error::Target source file does not exist: ${target_path}"
            exit 2
          fi
          if [ '${{ github.event.inputs.olean_only }}' = 'true' ]; then
            build_target="+${target}:olean"
          else
            build_target="${target}"
          fi
          requested_timeout='${{ github.event.inputs.build_timeout_minutes }}'
          if ! [[ "$requested_timeout" =~ ^[0-9]+$ ]]; then
            echo "Invalid build timeout '${requested_timeout}', using 200 minutes."
            requested_timeout=200
          fi
          actual_timeout="$requested_timeout"
          if [ "$actual_timeout" -gt 200 ]; then
            echo "Requested timeout ${actual_timeout} leaves too little checkpoint time; capping at 200 minutes."
            actual_timeout=200
          fi
          : > route-a-linux-smoke.log
          build_mode='${{ github.event.inputs.build_mode }}'
          direct_workers='${{ github.event.inputs.direct_workers }}'
          module_timeout_minutes='${{ github.event.inputs.module_timeout_minutes }}'
          case "$build_mode" in
            direct|lake) ;;
            *)
              echo "::error::Unknown build_mode '${build_mode}'; expected direct or lake."
              exit 2
              ;;
          esac
          if ! [[ "$direct_workers" =~ ^[0-9]+$ ]]; then
            echo "Invalid direct worker count '${direct_workers}', using 4."
            direct_workers=4
          fi
          if [ "$direct_workers" -lt 1 ]; then
            direct_workers=1
          fi
          if [ "$direct_workers" -gt 8 ]; then
            echo "Requested direct_workers=${direct_workers}; capping at 8 for ubuntu-latest."
            direct_workers=8
          fi
          direct_timeout="$actual_timeout"
          if [ "$build_mode" = "direct" ] && [ "$direct_timeout" -gt 5 ]; then
            direct_timeout=$((direct_timeout - 5))
          fi
          if ! [[ "$module_timeout_minutes" =~ ^[0-9]+$ ]]; then
            echo "Invalid module_timeout_minutes='${module_timeout_minutes}', using 150."
            module_timeout_minutes=150
          fi
          if [ "$module_timeout_minutes" -lt 10 ]; then
            module_timeout_minutes=10
          fi
          if [ "$module_timeout_minutes" -gt "$direct_timeout" ]; then
            module_timeout_minutes="$direct_timeout"
          fi
          build_status_recorded=0
          write_build_status() {
            local code="$1"
            local phase="$2"
            {
              echo "target=${target}"
              echo "build_target=${build_target}"
              echo "build_mode=${build_mode}"
              echo "direct_workers=${direct_workers}"
              echo "exit_code=${code}"
              echo "phase=${phase}"
              echo "requested_build_timeout_minutes=${requested_timeout}"
              echo "actual_build_timeout_minutes=${actual_timeout}"
              echo "direct_build_timeout_minutes=${direct_timeout}"
              echo "module_timeout_minutes=${module_timeout_minutes}"
              echo "workflow_sha=${GITHUB_SHA}"
              echo "updated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              df -h .
            } > route-a-build-status.txt
          }
          trap 'rc=$?; if [ "$build_status_recorded" -ne 1 ]; then write_build_status "$rc" "shell_exit_before_final_status"; echo "exit_code=$rc" >> "$GITHUB_OUTPUT" || true; fi' EXIT
          trap 'write_build_status 143 "terminated_before_final_status"; echo "exit_code=143" >> "$GITHUB_OUTPUT" || true; build_status_recorded=1; exit 143' TERM INT
          direct_force_args=()
          if [ -f .github/route_a_smoke/q0cert_force_rebuild_modules.txt ]; then
            direct_force_args+=(--force-module-list .github/route_a_smoke/q0cert_force_rebuild_modules.txt)
            echo "Direct force module list: .github/route_a_smoke/q0cert_force_rebuild_modules.txt" \
              | tee -a route-a-linux-smoke.log
          fi
          echo "Building ${build_target}" | tee -a route-a-linux-smoke.log
          echo "Build mode: ${build_mode}" | tee -a route-a-linux-smoke.log
          echo "Direct workers: ${direct_workers}" | tee -a route-a-linux-smoke.log
          echo "Build timeout guard: ${actual_timeout} minutes" | tee -a route-a-linux-smoke.log
          if [ "$build_mode" = "direct" ]; then
            echo "Direct builder self-timeout: ${direct_timeout} minutes" | tee -a route-a-linux-smoke.log
            echo "Direct module timeout: ${module_timeout_minutes} minutes" | tee -a route-a-linux-smoke.log
          fi
          echo "Disk before build:" | tee -a route-a-linux-smoke.log
          df -h | tee -a route-a-linux-smoke.log
          du -sh .lake .lake/build/lib/lean .lake/packages/*/.lake/build ~/.elan ~/.cache 2>/dev/null \
            | tee -a route-a-linux-smoke.log || true
          available_kb="$(df --output=avail -k . | tail -n 1 | tr -d ' ')"
          echo "Available KB before build: ${available_kb}" | tee -a route-a-linux-smoke.log
          if [ "$available_kb" -lt 8000000 ]; then
            echo "::warning::Less than 8 GB free before Route A build; runner may still exhaust disk."
          fi
          write_build_status "running" "build_started"
          set +e
          if [ "$build_mode" = "direct" ]; then
            timeout --signal=TERM --kill-after=30s "${actual_timeout}m" \
              lake env python3 -u scripts/ci/route_a_direct_olean_build.py \
                --target "$target" \
                --timeout-minutes "$direct_timeout" \
                --module-timeout-minutes "$module_timeout_minutes" \
                --workers "$direct_workers" \
                --trust-unstamped-cache \
                "${direct_force_args[@]}" \
              2>&1 | tee -a route-a-linux-smoke.log
            status=${PIPESTATUS[0]}
          else
            timeout --signal=TERM --kill-after=30s "${actual_timeout}m" \
              lake --log-level=error build "${build_target}" \
              2>&1 | tee -a route-a-linux-smoke.log
            status=${PIPESTATUS[0]}
          fi
          set -e
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          write_build_status "${status}" "build_finished"
          build_status_recorded=1
          if [ "$status" -eq 0 ]; then
            echo "Build completed successfully."
          elif [ "$status" -eq 124 ] || [ "$status" -eq 137 ] || [ "$status" -eq 143 ]; then
            echo "Build reached the workflow timeout guard; saving cache for a resumed run."
          else
            echo "Build failed with exit code ${status}; saving logs/cache for diagnosis."
          fi

      - name: Stop leftover Lean build processes
        if: always()
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          pkill -TERM -f '/lean .*Goldbach' || true
          pkill -TERM -f 'lake --log-level=error build' || true
          sleep 5
          pkill -KILL -f '/lean .*Goldbach' || true
          pkill -KILL -f 'lake --log-level=error build' || true

      - name: Report project artifact size
        if: always()
        id: artifact_size
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          df -h
          if [ -d .lake/build/lib/lean ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            du -sh .lake/build/lib/lean 2>/dev/null || true
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Lean library build artifact directory exists."
          fi

      - name: Save project Lake artifact cache
        id: route_a_cache_save
        if: always() && steps.artifact_size.outputs.exists == 'true'
        continue-on-error: true
        timeout-minutes: 45
        uses: actions/cache/save@v4
        with:
          path: .lake/build/lib/lean
          key: route-a-linux-smoke-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.inputs.build_mode }}-${{ github.event.inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Record cache checkpoint status
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          {
            echo "restore_sources_outcome=${{ steps.restore_sources.outcome }}"
            echo "restore_sources_conclusion=${{ steps.restore_sources.conclusion }}"
            echo "archive_audit_outcome=${{ steps.archive_audit.outcome }}"
            echo "archive_audit_conclusion=${{ steps.archive_audit.conclusion }}"
            echo "cache_elan_outcome=${{ steps.cache_elan.outcome }}"
            echo "cache_elan_conclusion=${{ steps.cache_elan.conclusion }}"
            echo "setup_lean_outcome=${{ steps.setup_lean.outcome }}"
            echo "setup_lean_conclusion=${{ steps.setup_lean.conclusion }}"
            echo "fetch_deps_outcome=${{ steps.fetch_deps.outcome }}"
            echo "fetch_deps_conclusion=${{ steps.fetch_deps.conclusion }}"
            echo "fetch_mathlib_outcome=${{ steps.fetch_mathlib.outcome }}"
            echo "fetch_mathlib_conclusion=${{ steps.fetch_mathlib.conclusion }}"
            echo "verify_target_outcome=${{ steps.verify_target.outcome }}"
            echo "verify_target_conclusion=${{ steps.verify_target.conclusion }}"
            echo "cache_restore_outcome=${{ steps.route_a_cache_restore.outcome }}"
            echo "cache_restore_conclusion=${{ steps.route_a_cache_restore.conclusion }}"
            echo "cache_restore_hit=${{ steps.route_a_cache_restore.outputs.cache-hit }}"
            echo "cache_restore_matched_key=${{ steps.route_a_cache_restore.outputs.cache-matched-key }}"
            echo "cache_save_outcome=${{ steps.route_a_cache_save.outcome }}"
            echo "cache_save_conclusion=${{ steps.route_a_cache_save.conclusion }}"
            echo "artifact_dir_exists=${{ steps.artifact_size.outputs.exists }}"
          } >> route-a-build-status.txt
          echo "Setup outcomes:"
          echo "Restore generated sources: ${{ steps.restore_sources.outcome }} / ${{ steps.restore_sources.conclusion }}"
          echo "Archive audit: ${{ steps.archive_audit.outcome }} / ${{ steps.archive_audit.conclusion }}"
          echo "Cache elan: ${{ steps.cache_elan.outcome }} / ${{ steps.cache_elan.conclusion }}"
          echo "Set up Lean: ${{ steps.setup_lean.outcome }} / ${{ steps.setup_lean.conclusion }}"
          echo "Fetch dependencies: ${{ steps.fetch_deps.outcome }} / ${{ steps.fetch_deps.conclusion }}"
          echo "Fetch Mathlib cache: ${{ steps.fetch_mathlib.outcome }} / ${{ steps.fetch_mathlib.conclusion }}"
          echo "Verify target: ${{ steps.verify_target.outcome }} / ${{ steps.verify_target.conclusion }}"
          echo "Cache restore outcome: ${{ steps.route_a_cache_restore.outcome }} / ${{ steps.route_a_cache_restore.conclusion }}"
          echo "Cache restore hit: ${{ steps.route_a_cache_restore.outputs.cache-hit }}"
          echo "Cache restore matched key: ${{ steps.route_a_cache_restore.outputs.cache-matched-key }}"
          echo "Cache save outcome: ${{ steps.route_a_cache_save.outcome }} / ${{ steps.route_a_cache_save.conclusion }}"
          echo "Artifact dir exists: ${{ steps.artifact_size.outputs.exists }}"

      - name: Dispatch continuation run after checkpoint timeout
        if: >-
          always() &&
          github.event.inputs.auto_continue == 'true' &&
          steps.artifact_size.outputs.exists == 'true'
        shell: bash
        timeout-minutes: 3
        env:
          BUILD_EXIT_CODE: ${{ steps.build.outputs.exit_code }}
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.event.inputs.target }}
          OLEAN_ONLY: ${{ github.event.inputs.olean_only }}
          BUILD_TIMEOUT_MINUTES: ${{ github.event.inputs.build_timeout_minutes }}
          BUILD_MODE: ${{ github.event.inputs.build_mode }}
          DIRECT_WORKERS: ${{ github.event.inputs.direct_workers }}
          MODULE_TIMEOUT_MINUTES: ${{ github.event.inputs.module_timeout_minutes }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          eval "$(python3 scripts/ci/route_a_resolve_build_status.py --shell)"
          if [ "$status" != "124" ] && [ "$status" != "137" ] && [ "$status" != "143" ]; then
            echo "No checkpoint continuation needed; build status '${status:-missing}' from ${source}."
            exit 0
          fi
          echo "Checkpoint timeout detected; dispatching continuation run for ${TARGET} on ${REF_NAME}."
          sleep 30
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          workflow_id = "route_a_linux_smoke.yml"
          url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow_id}/dispatches"
          payload = {
              "ref": os.environ["REF_NAME"],
              "inputs": {
                  "target": os.environ["TARGET"],
                  "olean_only": os.environ["OLEAN_ONLY"],
                  "build_timeout_minutes": os.environ["BUILD_TIMEOUT_MINUTES"],
                  "build_mode": os.environ["BUILD_MODE"],
                  "direct_workers": os.environ["DIRECT_WORKERS"],
                  "module_timeout_minutes": os.environ["MODULE_TIMEOUT_MINUTES"],
                  "auto_continue": "true",
              },
          }
          data = json.dumps(payload).encode()
          request = urllib.request.Request(
              url,
              data=data,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              print(f"Dispatched continuation run: HTTP {response.status}")
          PY

      - name: Upload smoke log
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: route-a-linux-smoke-log
          path: |
            route-a-linux-smoke.log
            route-a-build-status.txt
            route-a-direct-build-status.json
            route-a-restored-artifacts.txt
            route-a-src-deps.txt
            route-a-source-archive-audit.json
          retention-days: 14

      - name: Report final build status
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          BUILD_EXIT_CODE='${{ steps.build.outputs.exit_code }}'
          export BUILD_EXIT_CODE
          eval "$(python3 scripts/ci/route_a_resolve_build_status.py --shell)"
          if [ -z "$status" ]; then
            echo "Route A Linux smoke build step did not produce an exit code."
            echo "No fallback status was found in route-a-build-status.txt or route-a-direct-build-status.json."
            exit 1
          fi
          echo "Resolved build status: ${status} (${source})"
          if [ "$status" = "0" ]; then
            echo "Route A Linux smoke target built successfully."
            exit 0
          fi
          if [ "$status" = "124" ] || [ "$status" = "137" ] || [ "$status" = "143" ]; then
            echo "Route A Linux smoke target hit the timeout guard in this run. Cache/log artifacts were saved for resume."
            echo "Cache restore outcome: ${{ steps.route_a_cache_restore.outcome }} / ${{ steps.route_a_cache_restore.conclusion }}"
            echo "Cache restore hit: ${{ steps.route_a_cache_restore.outputs.cache-hit }}"
            echo "Cache restore matched key: ${{ steps.route_a_cache_restore.outputs.cache-matched-key }}"
            echo "Cache save outcome: ${{ steps.route_a_cache_save.outcome }} / ${{ steps.route_a_cache_save.conclusion }}"
            echo "Artifact dir exists: ${{ steps.artifact_size.outputs.exists }}"
            echo "Re-run the same workflow/input to continue from the saved cache checkpoint."
            exit 0
          fi
          echo "Route A Linux smoke target did not finish in this run. Exit code: ${status}"
          echo "Setup outcomes:"
          echo "Restore generated sources: ${{ steps.restore_sources.outcome }} / ${{ steps.restore_sources.conclusion }}"
          echo "Archive audit: ${{ steps.archive_audit.outcome }} / ${{ steps.archive_audit.conclusion }}"
          echo "Cache elan: ${{ steps.cache_elan.outcome }} / ${{ steps.cache_elan.conclusion }}"
          echo "Set up Lean: ${{ steps.setup_lean.outcome }} / ${{ steps.setup_lean.conclusion }}"
          echo "Fetch dependencies: ${{ steps.fetch_deps.outcome }} / ${{ steps.fetch_deps.conclusion }}"
          echo "Fetch Mathlib cache: ${{ steps.fetch_mathlib.outcome }} / ${{ steps.fetch_mathlib.conclusion }}"
          echo "Verify target: ${{ steps.verify_target.outcome }} / ${{ steps.verify_target.conclusion }}"
          echo "Cache restore outcome: ${{ steps.route_a_cache_restore.outcome }} / ${{ steps.route_a_cache_restore.conclusion }}"
          echo "Cache restore hit: ${{ steps.route_a_cache_restore.outputs.cache-hit }}"
          echo "Cache restore matched key: ${{ steps.route_a_cache_restore.outputs.cache-matched-key }}"
          echo "Cache save outcome: ${{ steps.route_a_cache_save.outcome }} / ${{ steps.route_a_cache_save.conclusion }}"
          echo "Artifact dir exists: ${{ steps.artifact_size.outputs.exists }}"
          if ! [[ "$status" =~ ^[0-9]+$ ]]; then
            echo "Resolved status is nonnumeric; treating this as an infrastructure/setup failure."
            echo "This is not a resumable Lean checkpoint. Fix the failed setup step reported above, then start a new run."
            exit 1
          fi
          echo "If this was a timeout guard, rerun the same workflow/input to restore the saved cache and continue."
          exit "$status"
