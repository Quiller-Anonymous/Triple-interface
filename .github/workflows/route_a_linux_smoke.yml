name: Route A Linux Smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Lean module to build"
        required: true
        default: "Goldbach.Cert.MajorArcModules.Q0MinorZeroModeNormalizedAverageX0PeriodicMainZeroNonCoprimeCoreResidualLeftOnlyThreeFinalAcc721"
      olean_only:
        description: "Build only the .olean target"
        required: true
        default: "true"
      build_timeout_minutes:
        description: "Stop the build before GitHub's 6h job limit so cache/artifacts can save"
        required: true
        default: "240"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.target }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build selected Route A target on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 270

    steps:
      - uses: actions/checkout@v4

      - name: Restore Route A smoke generated sources
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ -f .github/route_a_smoke/acc721_missing_sources.tar.gz ]; then
            shasum -a 256 -c .github/route_a_smoke/acc721_missing_sources.tar.gz.sha256
            tar -xzf .github/route_a_smoke/acc721_missing_sources.tar.gz
            echo "Restored Route A generated smoke-test sources:"
            tar -tzf .github/route_a_smoke/acc721_missing_sources.tar.gz | wc -l
          else
            echo "No Route A smoke source archive found."
          fi

      - name: Workflow input summary
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          echo "Workflow SHA: ${GITHUB_SHA}"
          echo "target=${{ github.event.inputs.target }}"
          echo "olean_only=${{ github.event.inputs.olean_only }}"
          echo "build_timeout_minutes=${{ github.event.inputs.build_timeout_minutes }}"

      - name: Cache elan toolchain
        timeout-minutes: 10
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Set up Lean
        timeout-minutes: 20
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Environment diagnostics
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          echo "Cores: $(nproc)"
          free -h || true
          echo "Stack before:"
          ulimit -s || true
          ulimit -s unlimited || true
          echo "Stack after:"
          ulimit -s || true
          elan --version
          lake --version
          lean --version
          timeout --version || true
          git rev-parse HEAD
          echo "Workflow SHA: ${GITHUB_SHA}"
          echo "Requested build timeout: ${{ github.event.inputs.build_timeout_minutes }} minutes"
          df -h

      - name: Fetch dependencies
        timeout-minutes: 20
        run: lake update

      - name: Fetch Mathlib cache
        timeout-minutes: 45
        run: lake exe cache get

      - name: Prepare smoke log files
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          : > route-a-linux-smoke.log
          {
            echo "target=${{ github.event.inputs.target }}"
            echo "exit_code=not_started"
            echo "build_timeout_minutes=${{ github.event.inputs.build_timeout_minutes }}"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "prepared_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > route-a-build-status.txt

      - name: Restore project Lake artifact cache
        id: route_a_cache_restore
        continue-on-error: true
        timeout-minutes: 20
        uses: actions/cache/restore@v4
        with:
          path: .lake/build/lib/lean/Goldbach
          key: route-a-linux-smoke-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.inputs.target }}-latest
          restore-keys: |
            route-a-linux-smoke-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.inputs.target }}-

      - name: Build selected target
        id: build
        shell: bash
        timeout-minutes: 260
        run: |
          set -euo pipefail
          target='${{ github.event.inputs.target }}'
          if [ '${{ github.event.inputs.olean_only }}' = 'true' ]; then
            build_target="+${target}:olean"
          else
            build_target="${target}"
          fi
          requested_timeout='${{ github.event.inputs.build_timeout_minutes }}'
          if ! [[ "$requested_timeout" =~ ^[0-9]+$ ]]; then
            echo "Invalid build timeout '${requested_timeout}', using 240 minutes."
            requested_timeout=240
          fi
          actual_timeout="$requested_timeout"
          if [ "$actual_timeout" -gt 240 ]; then
            echo "Requested timeout ${actual_timeout} is too close to GitHub's 6h cap; capping at 240 minutes."
            actual_timeout=240
          fi
          : > route-a-linux-smoke.log
          echo "Building ${build_target}" | tee -a route-a-linux-smoke.log
          echo "Build timeout guard: ${actual_timeout} minutes" | tee -a route-a-linux-smoke.log
          echo "Disk before build:" | tee -a route-a-linux-smoke.log
          df -h | tee -a route-a-linux-smoke.log
          du -sh .lake .lake/build/lib/lean/Goldbach ~/.elan ~/.cache 2>/dev/null \
            | tee -a route-a-linux-smoke.log || true
          set +e
          timeout --signal=TERM --kill-after=30s "${actual_timeout}m" \
            lake --log-level=error build "${build_target}" \
            2>&1 | tee -a route-a-linux-smoke.log
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          {
            echo "target=${target}"
            echo "build_target=${build_target}"
            echo "exit_code=${status}"
            echo "requested_build_timeout_minutes=${requested_timeout}"
            echo "actual_build_timeout_minutes=${actual_timeout}"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > route-a-build-status.txt
          if [ "$status" -eq 0 ]; then
            echo "Build completed successfully."
          elif [ "$status" -eq 124 ] || [ "$status" -eq 137 ] || [ "$status" -eq 143 ]; then
            echo "Build reached the workflow timeout guard; saving cache for a resumed run."
          else
            echo "Build failed with exit code ${status}; saving logs/cache for diagnosis."
          fi

      - name: Stop leftover Lean build processes
        if: always()
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          pkill -TERM -f '/lean .*Goldbach' || true
          pkill -TERM -f 'lake --log-level=error build' || true
          sleep 5
          pkill -KILL -f '/lean .*Goldbach' || true
          pkill -KILL -f 'lake --log-level=error build' || true

      - name: Report project artifact size
        if: always()
        id: artifact_size
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          df -h
          if [ -d .lake/build/lib/lean/Goldbach ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            du -sh .lake/build/lib/lean/Goldbach || true
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Goldbach build artifact directory exists."
          fi

      - name: Save project Lake artifact cache
        id: route_a_cache_save
        if: always() && steps.artifact_size.outputs.exists == 'true'
        continue-on-error: true
        timeout-minutes: 45
        uses: actions/cache/save@v4
        with:
          path: .lake/build/lib/lean/Goldbach
          key: route-a-linux-smoke-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ github.event.inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Record cache checkpoint status
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          {
            echo "cache_restore_outcome=${{ steps.route_a_cache_restore.outcome }}"
            echo "cache_restore_conclusion=${{ steps.route_a_cache_restore.conclusion }}"
            echo "cache_save_outcome=${{ steps.route_a_cache_save.outcome }}"
            echo "cache_save_conclusion=${{ steps.route_a_cache_save.conclusion }}"
            echo "artifact_dir_exists=${{ steps.artifact_size.outputs.exists }}"
          } >> route-a-build-status.txt
          echo "Cache restore outcome: ${{ steps.route_a_cache_restore.outcome }} / ${{ steps.route_a_cache_restore.conclusion }}"
          echo "Cache save outcome: ${{ steps.route_a_cache_save.outcome }} / ${{ steps.route_a_cache_save.conclusion }}"
          echo "Artifact dir exists: ${{ steps.artifact_size.outputs.exists }}"

      - name: Upload smoke log
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: route-a-linux-smoke-log
          path: |
            route-a-linux-smoke.log
            route-a-build-status.txt
          retention-days: 14

      - name: Report final build status
        if: always()
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          status='${{ steps.build.outputs.exit_code }}'
          if [ -z "$status" ]; then
            echo "Route A Linux smoke build step did not produce an exit code."
            echo "Check earlier setup/cache steps; route-a-build-status.txt should say not_started."
            exit 1
          fi
          if [ "$status" = "0" ]; then
            echo "Route A Linux smoke target built successfully."
            exit 0
          fi
          echo "Route A Linux smoke target did not finish in this run. Exit code: ${status}"
          echo "Cache restore outcome: ${{ steps.route_a_cache_restore.outcome }} / ${{ steps.route_a_cache_restore.conclusion }}"
          echo "Cache save outcome: ${{ steps.route_a_cache_save.outcome }} / ${{ steps.route_a_cache_save.conclusion }}"
          echo "Artifact dir exists: ${{ steps.artifact_size.outputs.exists }}"
          echo "If this was a timeout guard, rerun the same workflow/input to restore the saved cache and continue."
          exit "$status"
