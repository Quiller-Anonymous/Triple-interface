name: Lean CI

on:
  push:
    # Optional but HIGH impact: avoid running CI when only non-build files change.
    # Tune this list to your repo.
    paths:
      - "**/*.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - ".github/workflows/**"
      - "lean-toolchain"
  pull_request:
    paths:
      - "**/*.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - ".github/workflows/**"
      - "lean-toolchain"
  schedule:
    # Nightly heavy build (finite-base chunks + full Goldbach pipeline).
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      build_finite_base:
        description: "Build finite-base verified chunks (very slow)"
        required: false
        default: "false"

# Make concurrency more specific so runs don’t cancel each other across event types,
# but still cancel outdated runs for the SAME PR/branch + event.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-fast:
    name: Build Goldbach (fast targets)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Cache Lake deps + build outputs.
      # This is the main lever for “reasonable time” on repeated runs.
      - name: Cache Lake
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Set up Lean
        uses: leanprover/lean-action@v1

      - name: Fetch dependencies
        run: lake update

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build fast Goldbach targets
        run: |
          set -euo pipefail
          # Keep this job finite-base-free (the finite base is built only on the nightly/dispatch path).
          lake build Goldbach.CompleteTenorFunX_CanonBudget
          lake build Goldbach.AO_OffDiag.EntryPointTenorFunX
          lake build Goldbach.BG_CalibBridgeStub

  discover-chunks:
    name: Discover finite-base chunks
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_finite_base == 'true') }}
    outputs:
      prefix_batches: ${{ steps.prefixes.outputs.prefix_batches }}
      count: ${{ steps.prefixes.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute chunk prefixes
        id: prefixes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(Goldbach/FiniteBase/Chunks/Chunk*_verified.lean)
          if [ ${#files[@]} -eq 0 ]; then
            echo "prefix_batches=[]" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "No verified chunk files found."
            exit 0
          fi

          prefixes_json=$(
            printf '%s\n' "${files[@]}" \
              | sed -E 's#.*/Chunk([0-9]{3})_.*#\1#' \
              | sort -u \
              | python3 -c 'import sys, json; xs=[ln.strip() for ln in sys.stdin if ln.strip()]; print(json.dumps(xs))'
          )

          prefix_batches=$(
            PREFIXES_JSON="$prefixes_json" BATCH_SIZE="8" python3 - <<'PY'
          import json, os
          prefixes = json.loads(os.environ["PREFIXES_JSON"])
          batch_size = int(os.environ.get("BATCH_SIZE", "8"))
          batches = [prefixes[i:i+batch_size] for i in range(0, len(prefixes), batch_size)]
          print(json.dumps(batches))
          PY
          )

          echo "prefix_batches=$prefix_batches" >> "$GITHUB_OUTPUT"
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          echo "Found ${#files[@]} verified chunk files."
          echo "Prefix batches: $prefix_batches"

  build-chunk-deps:
    name: Build finite-base chunk dependencies
    needs: discover-chunks
    if: ${{ needs.discover-chunks.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cache Lake
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Set up Lean
        uses: leanprover/lean-action@v1

      - name: Fetch dependencies
        run: lake update

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build chunk dependency kit
        run: |
          set -euo pipefail
          lake build Goldbach.FiniteBase.FiniteBaseChunkKit
          lake build Goldbach.FiniteBase.Completeness.CompletenessKit

      - name: Upload chunk dependency artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finite-base-chunk-deps
          path: |
            .lake/build/lib/lean/Goldbach/Base/*.olean
            .lake/build/lib/lean/Goldbach/Base/*.ilean
            .lake/build/lib/lean/Goldbach/FiniteBase/**/*.olean
            .lake/build/lib/lean/Goldbach/FiniteBase/**/*.ilean
            .lake/build/lib/lean/Goldbach/Windows.olean
            .lake/build/lib/lean/Goldbach/Windows.ilean
          retention-days: 1

  build-chunks:
    name: Build finite-base chunks
    needs: [discover-chunks, build-chunk-deps]
    if: ${{ needs.discover-chunks.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.discover-chunks.outputs.prefix_batches) }}
      # Consider lowering this if you see long queue times or throttling.
      max-parallel: 6

    steps:
      - uses: actions/checkout@v4

      - name: Cache Lake
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
          # Use a slightly different key per batch to reduce cache stampede.
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-batch-${{ join(matrix.batch, '-') }}
          restore-keys: |
            ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
            ${{ runner.os }}-lake-

      - name: Set up Lean
        uses: leanprover/lean-action@v1

      - name: Fetch dependencies
        run: lake update

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Download chunk dependency artifacts
        uses: actions/download-artifact@v4
        with:
          name: finite-base-chunk-deps
          path: .chunk_deps

      - name: Install chunk dependency artifacts into `.lake/build`
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Goldbach/FiniteBase/Completeness
          mkdir -p .lake/build/lib/lean/Goldbach/FiniteBase
          mkdir -p .lake/build/lib/lean/Goldbach/Base
          mkdir -p .lake/build/lib/lean/Goldbach
          cp -a .chunk_deps/. .lake/build/lib/lean/Goldbach/

      - name: Build chunks (batch ${{ toJson(matrix.batch) }})
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          batch='${{ toJson(matrix.batch) }}'
          prefixes=$(python3 -c 'import json,sys; print("\n".join(json.loads(sys.argv[1])))' "$batch")

          mods=()
          while IFS= read -r prefix; do
            files=(Goldbach/FiniteBase/Chunks/Chunk${prefix}_*_verified.lean)
            for f in "${files[@]}"; do
              mods+=("Goldbach.FiniteBase.Chunks.$(basename "$f" .lean)")
            done
          done <<< "$prefixes"

          if [ ${#mods[@]} -eq 0 ]; then
            echo "No chunk modules found for batch: $batch"
            exit 0
          fi

          echo "Building ${#mods[@]} chunk modules in this batch:"
          printf '  %s\n' "${mods[@]}"

          printf '%s\n' "${mods[@]}" | xargs -n 50 lake build

      - name: Upload chunk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finite-base-chunks-batch-${{ join(matrix.batch, '-') }}
          path: |
            .lake/build/lib/lean/Goldbach/FiniteBase/Chunks/Chunk*_verified.olean
            .lake/build/lib/lean/Goldbach/FiniteBase/Chunks/Chunk*_verified.ilean
          retention-days: 1

  build:
    name: Build Goldbach (full, incl. finite base)
    needs: [discover-chunks, build-chunks]
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_finite_base == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Fail if chunk build failed
        if: ${{ needs.discover-chunks.outputs.count != '0' && needs.build-chunks.result != 'success' }}
        run: |
          echo "Chunk build job did not succeed: ${{ needs.build-chunks.result }}"
          exit 1

      - uses: actions/checkout@v4

      - name: Cache Lake
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Set up Lean
        uses: leanprover/lean-action@v1

      - name: Fetch dependencies
        run: lake update

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Download chunk artifacts (if any)
        if: ${{ needs.discover-chunks.outputs.count != '0' }}
        uses: actions/download-artifact@v4
        with:
          pattern: finite-base-chunks-batch-*
          path: .chunk_artifacts
          merge-multiple: true

      - name: Install chunk artifacts into `.lake/build`
        if: ${{ needs.discover-chunks.outputs.count != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Goldbach/FiniteBase/Chunks
          cp -a .chunk_artifacts/. .lake/build/lib/lean/Goldbach/FiniteBase/Chunks/

      - name: Build (Goldbach pipeline)
        run: |
          set -euo pipefail
          # Full end-to-end build: canonical Tenor-aligned FunX track + checked finite base.
          lake build Goldbach.GoldFunX
