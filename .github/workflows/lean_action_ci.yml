name: Lean CI

on:
  # Depot-only mode: avoid consuming GitHub Actions minutes by running automatically.
  workflow_dispatch:
    inputs:
      build_finite_base:
        description: "Build finite-base verified chunks (very slow)"
        required: false
        default: "false"
      build_full_pipeline:
        description: "Also build full Goldbach pipeline including finite base (very slow)"
        required: false
        default: "false"

# Make concurrency more specific so runs don’t cancel each other across event types,
# but still cancel outdated runs for the SAME PR/branch + event.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-fast:
    name: Build Goldbach (fast targets)
    runs-on: ubuntu-latest
    # The default runner limit is much higher; this job sometimes runs close to an hour and then
    # gets killed during post-steps (cache/artifact finalization). Give it more headroom.
    timeout-minutes: 180
    # Avoid running this job during the heavy finite-base chunk run; it just burns time/CPU and can
    # fail the workflow due to a timeout even if the chunk pipeline succeeds.
    if: ${{ github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.build_finite_base == 'true') }}
    steps:
      - uses: actions/checkout@v4

      # Cache the Lean toolchain (small, stable).
      # Avoid caching `.lake/packages` / `.lake/build`: they routinely exceed GitHub’s cache limits
      # and the (failed) cache save/restore can dominate job time.
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Set up Lean
        uses: leanprover/lean-action@v1

      - name: Fetch dependencies
        run: lake update

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build fast Goldbach targets
        run: |
          set -euo pipefail
          # Keep this job finite-base-free (the finite base is built only on the nightly/dispatch path).
          # Only build OLean artifacts (avoid generating `.c`/IR; huge and not needed for proof checking).
          lake build +Goldbach.CompleteTenorFunX_CanonBudget:olean
          lake build +Goldbach.AO_OffDiag.EntryPointTenorFunX:olean
          lake build +Goldbach.BG_CalibBridgeStub:olean

  discover-chunks:
    name: Discover finite-base chunks
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_finite_base == 'true' || github.event.inputs.build_full_pipeline == 'true')) }}
    outputs:
      prefix_batches: ${{ steps.prefixes.outputs.prefix_batches }}
      count: ${{ steps.prefixes.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute chunk prefixes
        id: prefixes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(Goldbach/FiniteBase/Chunks/Chunk*_verified.lean)
          if [ ${#files[@]} -eq 0 ]; then
            echo "prefix_batches=[]" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "No verified chunk files found."
            exit 0
          fi

          prefixes_json=$(
            printf '%s\n' "${files[@]}" \
              | sed -E 's#.*/Chunk([0-9]{3})_.*#\1#' \
              | sort -u \
              | python3 -c 'import sys, json; xs=[ln.strip() for ln in sys.stdin if ln.strip()]; print(json.dumps(xs))'
          )

          prefix_batches=$(
            # Tune these if chunk jobs are timing out:
            # - smaller `BATCH_SIZE` => more matrix jobs, each job does less work
            # - larger `max-parallel` => more concurrent jobs (subject to runner limits)
            PREFIXES_JSON="$prefixes_json" BATCH_SIZE="4" python3 - <<'PY'
          import json, os
          prefixes = json.loads(os.environ["PREFIXES_JSON"])
          batch_size = int(os.environ.get("BATCH_SIZE", "8"))
          batches = [prefixes[i:i+batch_size] for i in range(0, len(prefixes), batch_size)]
          print(json.dumps(batches))
          PY
          )

          echo "prefix_batches=$prefix_batches" >> "$GITHUB_OUTPUT"
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          echo "Found ${#files[@]} verified chunk files."
          echo "Prefix batches: $prefix_batches"

  build-chunks:
    name: Build finite-base chunks
    needs: discover-chunks
    if: ${{ needs.discover-chunks.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.discover-chunks.outputs.prefix_batches) }}
      # Consider lowering this if you see long queue times or throttling.
      max-parallel: 12

    steps:
      - uses: actions/checkout@v4

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Set up Lean
        uses: leanprover/lean-action@v1

      - name: Fetch dependencies
        run: lake update

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Compute chunk cache key (batch ${{ toJson(matrix.batch) }})
        id: chunk_cache
        shell: bash
        run: |
          set -euo pipefail

          batch='${{ toJson(matrix.batch) }}'
          batch_id=$(python3 -c 'import json,sys; xs=json.loads(sys.argv[1]); print("-".join(xs))' "$batch")
          inputs_hash=$(
            python3 - <<'PY' "$batch"
          import glob
          import hashlib
          import json
          import os
          import sys

          batch = json.loads(sys.argv[1])
          h = hashlib.sha256()

          def add_file(path: str) -> None:
            with open(path, "rb") as f:
              h.update(path.encode("utf-8") + b"\0")
              h.update(f.read())

          # Invalidate when toolchain/deps change.
          for path in ["lean-toolchain", "lakefile.lean", "lake-manifest.json"]:
            if os.path.exists(path):
              add_file(path)

          # Invalidate when any chunk in this batch changes.
          files: list[str] = []
          for prefix in batch:
            files.extend(glob.glob(f"Goldbach/FiniteBase/Chunks/Chunk{prefix}_*_verified.lean"))
          for path in sorted(set(files)):
            add_file(path)

          print(h.hexdigest())
          PY
          )

          echo "batch_id=$batch_id" >> "$GITHUB_OUTPUT"
          echo "inputs_hash=$inputs_hash" >> "$GITHUB_OUTPUT"

      # Cache only the compiled chunk OLeans for this batch (keeps within GitHub’s cache limits).
      # This makes the nightly/dispatch chunk jobs incremental across workflow runs.
      - name: Cache chunk OLeans (batch ${{ toJson(matrix.batch) }})
        uses: actions/cache@v4
        with:
          path: .ci-cache/chunks/${{ steps.chunk_cache.outputs.batch_id }}
          key: ${{ runner.os }}-goldbach-chunks-${{ steps.chunk_cache.outputs.batch_id }}-${{ steps.chunk_cache.outputs.inputs_hash }}
          restore-keys: |
            ${{ runner.os }}-goldbach-chunks-${{ steps.chunk_cache.outputs.batch_id }}-

      - name: Restore cached OLeans into Lake build dir
        shell: bash
        run: |
          set -euo pipefail

          src=".ci-cache/chunks/${{ steps.chunk_cache.outputs.batch_id }}"
          dst=".lake/build/lib/lean/Goldbach/FiniteBase/Chunks"
          if [ -d "$src" ]; then
            mkdir -p "$dst"
            cp -a "$src"/. "$dst"/
          fi

      - name: Build chunks (batch ${{ toJson(matrix.batch) }})
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          batch='${{ toJson(matrix.batch) }}'
          prefixes=$(python3 -c 'import json,sys; print("\n".join(json.loads(sys.argv[1])))' "$batch")

          mods=()
          while IFS= read -r prefix; do
            files=(Goldbach/FiniteBase/Chunks/Chunk${prefix}_*_verified.lean)
            for f in "${files[@]}"; do
              # Only build OLean artifacts (avoid generating `.c`/IR; huge and not needed for proof checking).
              mods+=("+Goldbach.FiniteBase.Chunks.$(basename "$f" .lean):olean")
            done
          done <<< "$prefixes"

          if [ ${#mods[@]} -eq 0 ]; then
            echo "No chunk modules found for batch: $batch"
            exit 0
          fi

          echo "Building ${#mods[@]} chunk modules in this batch:"
          printf '  %s\n' "${mods[@]}"

          printf '%s\n' "${mods[@]}" | xargs -n 50 lake build

      - name: Stage built OLeans for cache (batch ${{ toJson(matrix.batch) }})
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          batch='${{ toJson(matrix.batch) }}'
          prefixes=$(python3 -c 'import json,sys; print("\n".join(json.loads(sys.argv[1])))' "$batch")

          outdir=".ci-cache/chunks/${{ steps.chunk_cache.outputs.batch_id }}"
          rm -rf "$outdir"
          mkdir -p "$outdir"

          srcdir=".lake/build/lib/lean/Goldbach/FiniteBase/Chunks"
          while IFS= read -r prefix; do
            for f in \
              "$srcdir"/Chunk${prefix}_*_verified.olean \
              "$srcdir"/Chunk${prefix}_*_verified.olean.hash \
              "$srcdir"/Chunk${prefix}_*_verified.ilean \
              "$srcdir"/Chunk${prefix}_*_verified.ilean.hash \
              "$srcdir"/Chunk${prefix}_*_verified.trace; do
              [ -e "$f" ] && cp -a "$f" "$outdir"/
            done
          done <<< "$prefixes"

  build:
    name: Build Goldbach (full, incl. finite base)
    needs: [discover-chunks, build-chunks]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_full_pipeline == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Fail if chunk build failed
        if: ${{ needs.discover-chunks.outputs.count != '0' && needs.build-chunks.result != 'success' }}
        run: |
          echo "Chunk build job did not succeed: ${{ needs.build-chunks.result }}"
          exit 1

      - uses: actions/checkout@v4

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Set up Lean
        uses: leanprover/lean-action@v1

      - name: Fetch dependencies
        run: lake update

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build (Goldbach pipeline)
        run: |
          set -euo pipefail
          # Full end-to-end build: canonical Tenor-aligned FunX track + checked finite base.
          # Only build OLean artifacts (avoid generating `.c`/IR; huge and not needed for proof checking).
          lake build +Goldbach.GoldFunX:olean
